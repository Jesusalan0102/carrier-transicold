name: Build APK (TWA)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'twa/**'
  workflow_dispatch:   # permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. Java (requerido por Gradle/Android) ──────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Node (requerido por Bubblewrap) ──────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 4. Android SDK ──────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Instalar Bubblewrap CLI ──────────────────────────
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      # ── 6. Inicializar proyecto TWA ─────────────────────────
      - name: Init TWA project
        working-directory: twa
        run: |
          bubblewrap init --manifest https://app-83fd3b1b-5d1d-43fd-be37-63f56db0efe8.cleverapps.io/static/manifest.json \
            --directory . \
            --skipPwaValidation
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: '1'

      # ── 7. Build APK (debug, sin firmar — para instalación directa) ──
      - name: Build APK
        working-directory: twa
        run: bubblewrap build --skipPwaValidation
        env:
          BUBBLEWRAP_DISABLE_TELEMETRY: '1'

      # ── 8. Renombrar APK con versión y fecha ────────────────
      - name: Rename APK
        run: |
          DATE=$(date +'%Y%m%d')
          cp twa/app-release-unsigned.apk carrier-transicold-${DATE}.apk || \
          cp twa/app/build/outputs/apk/release/app-release-unsigned.apk carrier-transicold-${DATE}.apk || \
          find twa -name "*.apk" -exec cp {} carrier-transicold-${DATE}.apk \;
          echo "APK_NAME=carrier-transicold-${DATE}.apk" >> $GITHUB_ENV

      # ── 9. Subir APK como artifact (descargable desde Actions) ─
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      # ── 10. Crear Release automático ────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "APK v${{ github.run_number }} — Carrier Transicold"
          body: |
            ## 📱 APK Carrier Transicold
            
            **Build:** #${{ github.run_number }}  
            **Fecha:** ${{ github.event.head_commit.timestamp }}  
            **Commit:** ${{ github.sha }}
            
            ### Instalación
            1. Descarga el archivo `.apk`
            2. En tu Android ve a **Ajustes → Seguridad → Fuentes desconocidas** (actívalo)
            3. Abre el APK descargado e instala
            
            > ⚠️ Este APK es un debug build. Para producción se requiere firmado con keystore.
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
