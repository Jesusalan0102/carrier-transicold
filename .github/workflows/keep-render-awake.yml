name: Keep Render Awake

on:
  schedule:
    # Cada 10 minutos. GitHub puede retrasarlo un poco bajo carga, pero
    # sobra margen contra el límite de 15 min de inactividad de Render.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # permite dispararlo manualmente para probar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping la app
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            https://carrier-transicold-1.onrender.com/ || echo "⚠️ Ping falló (puede ser cold start, revisar si se repite)"
