name: CI Backend

# Corre en cada push y en cada PR que toque algo del backend.
# Objetivo: que un error de sintaxis o un import roto se detecte aquí,
# no cuando ya está corriendo (o fallando) en Clever Cloud.
on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      # ── Paso 1: sintaxis ──────────────────────────────────────────────────
      # Compila TODOS los .py del backend. Si algo tiene un error de sintaxis
      # (como el TDZ de horarios que se detectó ya en producción), esto falla
      # aquí en segundos, en vez de tronar el deploy o, peor, quedar corriendo
      # a medias en Clever Cloud.
      - name: Verificar sintaxis (py_compile)
        run: |
          find . -name "*.py" -not -path "./tests/*" -print0 \
            | xargs -0 python -m py_compile

      # ── Paso 2: tests ────────────────────────────────────────────────────
      - name: Correr tests (pytest)
        run: python -m pytest tests/ -v
